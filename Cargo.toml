[package]
name = "spotcapture"
version = "0.2.0"
edition = "2024"
rust-version = "1.85"
description = "Capture Spotify Desktop audio via PipeWire system output"
license = "MIT"

[dependencies]
anyhow = "1"
base64 = "0.22"
clap = { version = "4", features = ["derive"] }
regex = "1.10"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls-native-roots"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "net", "io-util", "time", "process", "sync"] }
url = "2"
env_logger = { version = "0.11", default-features = false }

[profile.release]
strip = true
lto = "thin"
